version: "3.9"

services:
  mysql:
    image: mysql:8.4
    restart: unless-stopped
    ports: ["3306:3306"]
    environment:
      MYSQL_ROOT_PASSWORD: "projectteam2@@"
      MYSQL_DATABASE: "secondary_battery_db"
      MYSQL_USER: "root2"
      MYSQL_PASSWORD: "projectteam2@"
    volumes:
      - db_data:/var/lib/mysql
      - ./mysql/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 10s
      retries: 10

  opcua-server:
    build:
      context: .
      dockerfile: opcua-server/Dockerfile
    container_name: opcua-server
    hostname: opcua-server
    env_file: ./config.env
    restart: unless-stopped
    ports: ["4840:4840"]
    depends_on:
      mysql:
        condition: service_healthy

  opcua-bridge:     # 옵션(모니터링). 필요 없으면 꺼도 됨.
    build:
      context: .
      dockerfile: opcua-bridge/Dockerfile
    container_name: opcua-bridge
    env_file: ./config.env
    restart: unless-stopped
    depends_on:
      - opcua-server

  plc-voltage:
    build:
      context: .
      dockerfile: plc-voltage/Dockerfile
    container_name: plc-voltage
    env_file: ./config.env
    environment:
      - PLC_PORT=6005
    restart: unless-stopped
    depends_on:
      - opcua-server

  vision1-writer:
    build:
      context: .
      dockerfile: vision1/Dockerfile
    container_name: vision1-writer
    env_file: ./config.env
    environment:
      - PLC_PORT=6007
    restart: unless-stopped
    depends_on:
      - opcua-server

  vision2-writer:
    build:
      context: .
      dockerfile: vision2/Dockerfile
    container_name: vision2-writer
    env_file: ./config.env
    environment:
      - PLC_PORT=6004
    restart: unless-stopped
    depends_on:
      - opcua-server

  cp-calculator:
    build:
      context: .
      dockerfile: cp-calculator/Dockerfile
    container_name: cp-calculator
    env_file: ./config.env
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy

  line-summary:
    build:
      context: .
      dockerfile: line-summary/Dockerfile
    env_file: ./config.env
    restart: "no"
    depends_on:
      mysql:
        condition: service_healthy

  pack-batcher:     # ✅ UA 신호 대신 DB 배치로 팩 생성
    build:
      context: .
      dockerfile: pack-batcher/Dockerfile
    container_name: pack-batcher
    env_file: ./config.env
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy

  ai-reporter:
    build: ./services/ai_reporter
    image: opcua_docker-ai-reporter
    container_name: ai-reporter
    environment:
      - REPORT_RUN_AT=08:15           # KST, 매일 08:15 실행
      - REPORT_AUDIENCES=operator,lead,manager
      # 선택: 텔레그램 알림(요약 텍스트 전송)
      #- TELEGRAM_BOT_TOKEN=${TELEGRAM_BOT_TOKEN}
      #- TG_CHAT_OPERATOR=${TG_CHAT_OPERATOR}
      #- TG_CHAT_LEAD=${TG_CHAT_LEAD}
      #- TG_CHAT_MANAGER=${TG_CHAT_MANAGER}
    depends_on:
      mysql:
        condition: service_healthy
    restart: always
    env_file:
      - config.env
    volumes:
      - ./reports:/reports

  dummy-seeder:
    build: ./services/dummy_seeder
    image: opcua_docker-dummy-seeder
    container_name: dummy-seeder
    depends_on:
      mysql:
        condition: service_healthy
    restart: on-failure
    env_file:
      - config.env

volumes:
  db_data: